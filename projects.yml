# Research lines and ongoing projects shown on projects.qmd (Research -> Projects).
# Rendered by projects-listing.ejs with styles in projects.css.
#
# Two kinds of entries:
#
#   kind: line       one band on the page
#     id           short slug, used as the page anchor and by projects (line: <id>)
#     number       "01", "02", ... (sets the order of the bands; keep the quotes)
#     title        line title
#     icon         Bootstrap icon name without "bi-" (https://icons.getbootstrap.com)
#     description  a short paragraph
#     areas        homepage "What we do" areas to link: clinical-tools | brain-meeg | open-pipelines | analysis-methods
#
#   kind: project    one card under "What we are doing" in its line
#     line         id of the line it belongs to
#     order        position inside the line (1, 2, ...)
#     title        project name
#     description  one sentence
#     link         (optional) main link: a URL, or a page of this site such as /posts/news-title/<post>.html
#     linklabel    (optional) button text: Repo | Website | App | Book | News | Tutorial | Paper (default "Open")
#     status       (optional) small badge, e.g. "in progress" (useful when there is no link yet)
#
# A line with no projects shows only its description.

# ── Research lines ─────────────────────────────────────────────────────

- kind: line
  id: measurement
  number: "01"
  title: "Better measurement in clinical neuropsychology"
  icon: rulers
  description: "Neuropsychological tests drive decisions about real patients, so their scores must be trustworthy. We develop new psychometric tests and improve how existing ones are built, normed and interpreted. We work side by side with clinicians to understand the problems they meet in everyday practice and to design solutions they can actually use, and we share what we learn beyond scientific papers, for example in an open book. Our current work focuses on tools to derive clinical cut-offs, methods to track change over time in individual patients (for example in neurodegenerative diseases), and better standards for reporting test results. We are also developing an R package that makes psychometric and statistical methods easier to apply in clinical neuropsychology."
  areas: [clinical-tools, analysis-methods]

- kind: line
  id: lab-to-ward
  number: "02"
  title: "Neurophysiology from the Lab to the ward"
  icon: activity
  description: "EEG and MEG measure brain activity directly, non-invasively and with millisecond precision, and EEG is inexpensive and portable enough to reach the bedside. We believe these techniques can do much more for patients than they do today. While we study how the brain supports cognition and behaviour, we ask which neurophysiological markers are reliable enough to support diagnosis, prognosis and rehabilitation, and we test them in clinical populations. For this to work, analyses must be robust and transparent: we build open pipelines, use multiverse analyses to show how results depend on analytic choices, and write tutorials so that other labs and clinicians can reproduce and use our methods."
  areas: [brain-meeg, open-pipelines]

- kind: line
  id: metascience
  number: "03"
  title: "Meta-science for neurorehabilitation"
  icon: diagram-3
  description: "Rehabilitation is crucial for patients, and its evidence comes from trials. To really improve rehabilitation we need to improve that evidence: shared research plans, adequately powered studies, better reporting standards, and close collaboration with clinicians from design to interpretation. It also takes policies, for example on data sharing, so that individual participant data (IPD) can be pooled across studies. In turn, sound statistical methods and alternative designs, such as observational studies of clinical data, can become part of routine clinical practice."
  areas: [analysis-methods]

