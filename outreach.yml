# Outreach materials shown on outreach.qmd (talks, guides, tutorials, books).
#
# One entry per deck. Fields:
#   id           short slug; the thumbnail is files/images/outreach/<id>.png
#   title        shown on the card
#   description  one or two sentences
#   date         YYYY-MM-DD (only the year is shown on the card)
#   categories   [<Type>, <Language>]   Type: Talk | Course | Guide | Tutorial | Book   Language: English | Italiano
#   path         main link (the "Slides" button): a URL outside this repo, never /files/...:
#                  PDF -> GitHub release asset, https://github.com/<u>/<repo>/releases/latest/download/<file>.pdf
#                         (or a GitHub blob URL if the PDF is tracked in its repo)
#                  HTML deck -> GitHub Pages of its repo, https://<u>.github.io/<repo>/<path>.html
#   image        thumbnail. Leave it at /files/images/outreach/<id>.png and run
#                `python scripts/outreach_thumbs.py` to generate it from the first page of the PDF.
#   thumbfrom    (optional) PDF/HTML to make the thumbnail from, when `path` is not a PDF
#   mainlabel    (optional) text of the main button (default: "Slides" for talks, "Read" for books, otherwise "Open")
#   videos       (optional) link to recorded videos ("Videos" button)
#   repo         (optional) GitHub repository ("Repo" button)
#   post         (optional) post on this site ("Read post" button)
#   extra / extralabel  (optional) a second link, e.g. another language version
#   featured     true -> also shown in the "Featured" row at the top (keep it to 3)

